name: EOD End-of-Day Batch

on:
  # ── EOD 장 마감 후 1일 1회 (KST 16:35 = UTC 07:35) ────────────────────────
  schedule:
    - cron: "35 7 * * 1-5"

  workflow_dispatch:   # 수동 실행 (미실행 시 즉시 보완용)

# ── 공통 환경변수 ─────────────────────────────────────────────────────────────
env:
  PYTHONPATH: ${{ github.workspace }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
  ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
  CRON_SECRET_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}

jobs:
  eod-batch:
    name: "EOD End-of-Day Batch"
    runs-on: ubuntu-latest
    concurrency:
      group: eod-batch
      cancel-in-progress: false  # EOD는 중간에 취소하지 않음 (데이터 무결성)
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 종가·대차 확정 수집 → LPS 재계산 → AI 백필 → FinalScore 갱신
      # → 섹터 시그널 → event_stats 재집계
      - name: "EOD 장 마감 배치 (--eod)"
        run: python scripts/run_daily_batch.py --eod

      # 처리 지연 메트릭 — 당일 파이프라인 품질 점검
      - name: "처리 지연 메트릭 점검"
        run: python scripts/check_processing_lag.py --today --alert
        continue-on-error: true

      # sector_macro 스테일니스 점검
      - name: "sector_macro 데이터 현황 점검"
        run: python scripts/backfill_sector_macro.py --status
        continue-on-error: true
